<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esaro TV - Web TV 24/7</title>
  <style>
    body {
      margin: 0;
      padding: 10px;
      background-color: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    /* LAYOUT PER COMPUTER (PC) */
    .main-layout {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 15px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .banner-box {
      width: 160px;
      flex-shrink: 0;
    }

    .banner-box img {
      width: 100%;
      height: auto;
      display: block;
    }

    .video-container {
      flex-grow: 1;
      max-width: 960px;
      position: relative;
      padding-bottom: 56.25%; /* Rapporto 16:9 per il video */
      height: 0;
      overflow: hidden;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* REGOLA PER CELLULARI E TABLET (Schermi sotto i 768px) */
    @media (max-width: 768px) {
      .main-layout {
        flex-direction: column; /* Mette gli elementi uno sotto l'altro */
        align-items: center;
      }

      .video-container {
        width: 100%; /* Il video occupa tutta la larghezza dello smartphone */
      }

      .banner-box {
        width: 100%;
        max-width: 320px; /* I banner si ridimensionano sotto al video */
        margin-top: 15px;
      }
    }
  </style>
</head>
<body>

  <main class="main-layout">

    <!-- BANNER SINISTRO (Su PC sta a sinistra, su mobile va sotto al video) -->
    <aside class="banner-box">
      <a href="https://www.tuosito-sponsor.it" target="_blank">
        <img src="Banner promo tv laterale.jpg" alt="Banner Sponsor">
      </a>
    </aside>

    <!-- PLAYER VIDEO CENTRALE -->
    <div class="video-container">
      <iframe src="https://www.youtube.com/embed/live_stream?channel=UCPbX4AsXzcbJ-g8JUSfAmzg" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>

    <!-- BANNER DESTRO (Su PC sta a destra, su mobile va in fondo) -->
    <aside class="banner-box">
      <a href="https://www.tuosito-sponsor.it" target="_blank">
        <img src="Banner promo tv laterale.jpg" alt="Banner Sponsor">
      </a>
    </aside>

  </main>

</body>
</html>
